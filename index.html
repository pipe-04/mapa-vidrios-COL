<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ecosistema del vidrio en Colombia</title>
<meta name="description" content="Mapa ecosistémico interactivo del vidrio en Colombia: sectores arquitectónico y automotriz. Universidad de los Andes, Vidrios Inteligentes, 2026.">
<style>
:root{--bg:#F6F5F2;--panel:#FFFFFF;--ink:#16181D;--muted:#5B6270;--line:#D9D6CF;--accent:#1F3A68;--chip:#ECEAE4;--shadow:0 8px 30px rgba(20,24,32,.14)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{position:fixed;top:0;left:0;right:0;z-index:5;background:rgba(246,245,242,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 16px 8px}
h1{font-size:17px;margin:0 0 2px;font-weight:700;letter-spacing:-.01em}
.sub{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button,.btn{border:0;background:transparent;font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;color:var(--ink);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.btn{background:var(--chip)}
.btn[aria-pressed=true]{background:var(--accent);color:#fff}
.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{position:fixed;left:0;right:0;bottom:0;touch-action:none;overflow:hidden;cursor:grab}
#stage.drag{cursor:grabbing}
svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.node{cursor:pointer;transition:opacity .2s}
.node rect{transition:stroke-width .15s}
.node:hover rect{stroke-width:3.5}
.node.sel rect{stroke-width:4.5}
.dim{opacity:.13}
.edge{transition:opacity .2s}
.edge.hl path,.edge.hl polyline{stroke-width:3.4}
.t{font-size:16px;font-weight:700;fill:#111}.l{font-size:14.5px;fill:#222}
.g{font-size:14px;font-weight:700;letter-spacing:.5px}.c{font-size:15px;font-weight:700;fill:#333;letter-spacing:.6px}
.e{font-size:13px;font-style:italic;fill:#444;paint-order:stroke;stroke:#fff;stroke-width:4px}
.zoom{position:fixed;right:16px;bottom:16px;z-index:4;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:20px;box-shadow:var(--shadow);cursor:pointer;color:var(--ink)}
.zoom button.fit{font-size:12px}
#panel{position:fixed;z-index:6;background:var(--panel);box-shadow:var(--shadow);overflow:auto;transition:transform .25s ease;-webkit-overflow-scrolling:touch}
@media (min-width:821px){#panel{top:0;right:0;bottom:0;width:410px;transform:translateX(105%);border-left:1px solid var(--line)}#panel.open{transform:none}}
@media (max-width:820px){#panel{left:0;right:0;bottom:0;max-height:72vh;border-radius:18px 18px 0 0;transform:translateY(105%)}#panel.open{transform:none}#panel .grab{display:block}
 h1{font-size:15px}.sub{display:none}.seg button,.btn{font-size:12.5px;padding:6px 10px}}
#panel .grab{display:none;width:44px;height:5px;border-radius:3px;background:#CCC;margin:8px auto 0}
.pc{padding:18px 20px 28px}
.pc h2{font-size:19px;margin:6px 0 4px;line-height:1.25}
.tag{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:999px;margin:0 4px 8px 0;font-weight:600}
.pc p{font-size:14.5px;line-height:1.55;margin:8px 0}
.pc h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 0 6px}
.pc ul{padding-left:18px;margin:0}.pc li{font-size:13.5px;margin:4px 0;line-height:1.4}
.pc a{color:var(--accent);word-break:break-word}
.pc img{width:100%;border:1px solid var(--line);border-radius:10px;margin-top:4px}
.close{position:sticky;top:0;float:right;margin:10px 10px 0 0;width:36px;height:36px;border-radius:50%;border:0;background:var(--chip);font-size:18px;cursor:pointer}
.facts div{border-top:1px solid var(--line);padding:8px 0}.facts b{display:block;font-size:14px}.facts span{font-size:13.5px;color:#333}
.legend{display:grid;grid-template-columns:22px 1fr;gap:6px 8px;align-items:center;font-size:13px}
.legend i{display:block;width:22px;height:14px;border-radius:3px;border:2px solid}
.hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;background:#16181D;color:#fff;font-size:12.5px;padding:8px 14px;border-radius:999px;opacity:.88;pointer-events:none;transition:opacity .6s;white-space:nowrap}
</style>
</head>

const D = {"nodes": [{"id": "g1", "x": 40, "y": 120, "w": 384, "h": 110, "t": "gre", "sec": "arq", "ti": "Acolvise (2004)", "ls": ["normalización, conocimiento,", "defensa comercial; preside", "un directivo de Vidplex"], "det": "Asociación Colombiana de Sistemas Vidriados. Reúne transformadores y comercializadores de vidrio de seguridad, proveedores de insumos para cerramientos y fabricantes de ventanería. Trabaja en normalización, conocimiento y conexión entre empresas con ICONTEC, la SCA y el CCCS. Su interés principal es la defensa comercial frente a importaciones a bajo precio.", "src": [{"l": "Acolvise, gestión", "u": "http://acolvise.org/inicio/gestion/"}, {"l": "Semana (2025), Acolvise e importaciones", "u": "https://www.semana.com/economia/articulo/industria-nacional-del-vidrio-para-construccion-al-borde-de-la-desaparicion-expertos-claman-por-medidas-urgentes/202533/"}], "img": null}, {"id": "g2", "x": 438, "y": 120, "w": 384, "h": 110, "t": "gre", "sec": "arq", "ti": "Camacol · CCCS · SCA", "ls": ["construcción, edificación", "sostenible e informes jurídicos"], "det": "Camacol representa a los constructores, es decir, a los compradores de vidrio; por ende, en materia arancelaria su interés es el contrario al del productor primario. El CCCS impulsa la construcción sostenible y la SCA participa en la normalización con Acolvise.", "src": [{"l": "Camacol, Informe Jurídico 1036", "u": "https://camacol.co/sites/default/files/descargables/INFORMEJURIDICO%201036_0.pdf"}, {"l": "Acolvise, gestión", "u": "http://acolvise.org/inicio/gestion/"}], "img": null}, {"id": "g3", "x": 835, "y": 120, "w": 384, "h": 110, "t": "gre", "sec": "aut", "ti": "Acolfa · Andemos", "ls": ["autopartes, producción y", "ventas de vehículos"], "det": "Acolfa agrupa a los fabricantes de autopartes y Andemos a los importadores y vendedores de vehículos. Son la fuente de cifras de producción y ventas del sector automotriz.", "src": [{"l": "El Carro Colombiano, Sofasa 2025", "u": "https://www.el ": "aut", "ti": "Supervigilancia · SIC", "ls": ["blindaje vehicular autorizado;", "reglamentos técnicos y patentes"], "det": "Supervigilancia autoriza y regula a las empresas de blindaje. La SIC expide reglamentos técnicos (acristalamientos de seguridad automotriz) y administra el registro de patentes en Colombia.", "src": [{"l": "SIC, reglamento de acristalamientos", "u": "https://www.sic.gov.co/sites/default/files/documentos/Reglamento_AcristalamientoSeguridad_sinTABLA.pdf"}, {"l": "Semana (2026), blindaje vehicular", "u": "https://www.semana.com/economia/capsulas/articulo/el-blindaje-vehicular-en-colombia-supera-los-277000-millones-y-el-renting-gana-espacio-con-neosecurity/202653/"}], "img": null}, {"id": "mp1", "x": 60, "y": 330, "w": 280, "h": 110, "t": "ins", "sec": "all", "ti": "Arena sílice, caliza, dolomita", "ls": ["minería nacional"], "det": "Componentes principales del vidrio sodocálcico. Se extraen en Colombia y abastecen tanto al vidrio plano (Vidrio Andino) como a envases (O-I Peldar).", "src": [{"l": "DNP, cadena del vidrio", "u": "https://colaboracion.dnp.gov.co/cdt/desarrollo%20empresarial/vidrio.pdf"}], "img": null}, {"id": "mp2", "x": 60, "y": 490, "w": 280, "h": 110, "t": "ins", "sec": "all", "ti": "Carbonato de sodio", "ls": ["principalmente importado"], "det": "Fundente que reduce la temperatura de fusión de la sílice. El calcín (vidrio reciclado) cumple una función similar y reduce el consumo de energía del horno.", "src": [{"l": "DNP, cadena del vidrio", "u": "https://colaboracion.dnp.gov.co/cdt/desarrollo%20empresarial/vidrio.pdf"}], "img": null}, {"id": "mp4", "x": 60, "y": 650, "w": 280, "h": 110, "t": "ins", "sec": "arq", "ti": "Perfiles de aluminio y PVC", "ls": ["Alutions (Tecnoglass), proveedores"], "det": "Tecnoglass se integra verticalmente con Alutions, su filial de fundición y extrusión de aluminio (cerca de 4.100 t/mes), y con líneas propias de vinilo.", "src": [{"l": "Tecnoglass, Form 10-K 2025 (SEC)", "u": "https://www.sec.gov/ cia por confirmar. En 2025: China 57,7 %, Indonesia 23,7 %, Malasia 17,1 %.", "src": [{"l": "MinCIT, Decreto 636 de 2026", "u": "https://www.mincit.gov.co/prensa/noticias/comercio/gobierno-adopta-medidas-para-industria-vidrio"}, {"l": "MinCIT, proyecto de decreto (2026)", "u": "https://www.mincit.gov.co/normatividad/proyectos-de-normatividad/proyectos-de-decreto-2026/06-05-2026-pd-incremento-arancel-vidrio.aspx"}], "img": null}, {"id": "im2", "x": 520, "y": 1130, "w": 300, "h": 110, "t": "imp", "sec": "arq", "ti": "Vidrio procesado listo para instalar", "ls": ["importaciones chinas +58 % en 5 años", "precios 33–40 % menores (Acolvise)"], "det": "Según Acolvise, ya no solo entra materia prima sino vidrio templado o laminado listo para instalar, que compite directamente con los transformadores nacionales. Los ingresos de la industria nacional cayeron 19 % en 2024.", "src": [{"l": "Semana (2025), Acolvise e importaciones", "u": "https://www.semana.com/economia/articulo/industria-nacional-del-vidrio-para-construccion-al-borde-de-la-desaparicion-expertos-claman-por-medidas-urgentes/202533/"}], "img": null}, {"id": "im3", "x": 520, "y": 1290, "w": 300, "h": 110, "t": "imp", "sec": "aut", "ti": "Vidrio automotriz de reposición", "ls": ["Fuyao, Xinyi (partida 7007.21)", "no existe fabricación local de", "parabrisas OEM identificada"], "det": "La reposición automotriz se abastece con importaciones; hay registros aduaneros de parabrisas Fuyao para Renault Duster y Sandero y de vidrio Xinyi (partida 7007.21).", "src": [{"l": "Veritrade, importaciones 7007.21", "u": "https://www.veritradecorp.com/es/colombia/importaciones-y-exportaciones-glass--laminados----templados--importaciones--sas/nit-900519083"}], "img": null}, {"id": "tg", "x": 1000, "y": 330, "w": 330, "h": 110, "t": "sec", "sec": "arq", "ti": "Tecnoglass (Barranquilla)", "ls": ["integrada: low-e, templado, laminado,", "IGU, ventanas y fachadas", "USD 983,6 M (2025); 9.601 empleados", "≈96 % de ventas en EE. UU."], "de const setVB=()=>svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
function layout(){const top=document.querySelector('header').offsetHeight;stage.style.top=top+'px';fit(false)}
function fit(full=true){const r=stage.getBoundingClientRect(),a=r.width/r.height;const pad=20,CW=W;let w=CW+pad*2,h=H+pad*2;if(w/h>a)h=w/a;else w=h*a;
  if(r.width<820&&!full){h=1700;w=h*a;vb={x:0,y:60,w,h};}else vb={x:(CW-w)/2,y:(H-h)/2,w,h};setVB()}
function zoomAt(f,cx,cy){const r=stage.getBoundingClientRect();const px=vb.x+(cx-r.left)/r.width*vb.w,py=vb.y+(cy-r.top)/r.height*vb.h;
  const nw=Math.min(Math.max(vb.w*f,300),W*2.5),k=nw/vb.w;vb={x:px-(px-vb.x)*k,y:py-(py-vb.y)*k,w:nw,h:vb.h*k};setVB()}
function center(n){vb.x=n.x+n.w/2-vb.w/2;vb.y=n.y+n.h/2-vb.h/2;setVB()}
const cR=()=>{const r=stage.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
document.getElementById('zi').onclick=()=>zoomAt(.75,...cR());document.getElementById('zo').onclick=()=>zoomAt(1.33,...cR());document.getElementById('zf').onclick=()=>fit(true);
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(e.deltaY*.0015),e.clientX,e.clientY)},{passive:false});
const P=new Map();let last=null,moved=false,pinch=null;
stage.addEventListener('pointerdown',e=>{P.set(e.pointerId,[e.clientX,e.clientY]);moved=false;last=[e.clientX,e.clientY];if(P.size===2){const [a,b]=[...P.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1])}});
stage.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const prev=P.get(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
  if(P.size===2&&pinch){const [a,b]=[...P.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);zoomAt(pinch/d,(a[0]+b[0])/2,(a[1]+b[1])/2);pinch=d;moved=true;return}
  const dx=e.clientX-prev[0],dy=e.clientY-prev[1];if(Math.abs(e.clientX-last[0])+Math.abs(e.clientY-last[1])>6){moved=true;stage.classList.add('drag');try{stage.setPointerCapture(e.pointerId)}catch(_){}}
  if(moved){const r=stage.getBoundingClientRect();vb.x-=dx*vb.w/r.width;vb.y-=dy*vb.h/r.height;setVB()}});
const up=e=>{P.delete(e.pointerId);if(P.size<2)pinch=null;stage.classList.remove('drag');setTimeout(()=>moved=false,0)};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
svg.addEventListener('click',e=>{if(!moved&&!e.target.closest('.node')&&sel){sel=null;panel.classList.remove('open');paint()}});
window.addEventListener('resize',layout);layout();paint();
setTimeout(()=>document.getElementById('hint').style.opacity=0,4500);
</script>
</body>
</html>
